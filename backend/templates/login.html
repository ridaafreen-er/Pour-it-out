<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — My Journal</title>
    
    <!-- Google Fonts & Bootstrap Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

    <!-- Stylesheets: supports both Flask and Live Server -->
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="/static/style.css">

    <!-- Scripts -->
    <script src="../static/script.js" defer></script>
    <script src="/static/script.js" defer></script>
</head>
<body>

    <!-- Retro Navbar -->
    <header class="navbar">
        <div class="logo">
            <a href="home.html" style="text-decoration:none; display:flex; align-items:center; gap:0.5rem;">
                <h1>💻 My_Journal.exe</h1>
            </a>
        </div>
        <ul>
            <li><a href="home.html"><i class="bi bi-house-door"></i> Home</a></li>
            <li><a href="journal.html"><i class="bi bi-journal-text"></i> Journal</a></li>
            <li><a href="login.html" class="active"><i class="bi bi-box-arrow-in-right"></i> Sign In</a></li>
            <li><a href="register.html"><i class="bi bi-person-plus"></i> Register</a></li>
        </ul>
        <button class="btn-theme-toggle window-btn" style="width:28px;height:28px;font-size:14px;" title="Toggle Dark/Light Mode">
            <i class="bi bi-sun-fill"></i>
        </button>
    </header>

    <!-- Main Auth Area -->
    <main class="auth-container">
        
        <!-- Floating Retro Modal Window -->
        <div class="retro-window auth-window antigravity-float">
            
            <div class="window-titlebar">
                <div class="window-title">
                    <span class="pixel-icon">🔒</span>
                    <span>login.exe - [Authentication]</span>
                </div>
                <div class="window-controls">
                    <button class="window-btn" onclick="window.location.href='home.html'" title="Home">⌂</button>
                    <button class="window-btn" title="Minimize">—</button>
                    <button class="window-btn" title="Close">✕</button>
                </div>
            </div>

            <div class="window-menubar">
                <span class="menu-item">System</span>
                <span class="menu-item">Security</span>
                <span class="menu-item">Help</span>
            </div>

            <div class="window-body" style="padding:2.25rem 2rem;">
                <h2 class="auth-form-title">USER SIGN IN</h2>
                <p class="auth-form-subtitle">Enter your credentials to unlock your sanctuary</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">USERNAME:</label>
                        <input type="text" id="username" name="username" class="retro-input" placeholder="Enter username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password">PASSWORD:</label>
                        <div class="input-row-pwd">
                            <input type="password" id="password" name="password" class="retro-input" placeholder="Enter password" required>
                            <button type="button" class="btn-toggle-pwd" title="Show or hide password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="retro-btn" style="width:100%; margin-top:0.75rem; padding:10px;">
                        AUTHENTICATE &rarr;
                    </button>
                </form>

                <div id="message">
                    <span>Don't have an account? </span>
                    <a href="register.html">Register here</a>
                </div>
            </div>

        </div>

    </main>

    <!-- Retro Footer -->
    <footer class="footer">
        &copy; 2026 <strong>My Journal</strong>. Your thoughts, completely safe and private.
    </footer>

</body>
</html>
