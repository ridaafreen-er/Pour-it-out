<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — My Journal</title>
    
    <!-- Google Fonts & Bootstrap Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

    <!-- Stylesheets: supports both Flask and Live Server -->
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="/static/style.css">

    <!-- Scripts -->
    <script src="../static/script.js" defer></script>
    <script src="/static/script.js" defer></script>
</head>
<body>

    <!-- Frosted Navbar -->
    <header class="navbar">
        <div class="logo">
            <a href="home.html" style="text-decoration:none; display:flex; align-items:center; gap:0.5rem;">
                <h1>📔 My Journal</h1>
            </a>
        </div>
        <ul>
            <li><a href="home.html"><i class="bi bi-house-door"></i> Home</a></li>
            <li><a href="journal.html"><i class="bi bi-journal-text"></i> Journal</a></li>
            <li><a href="login.html" class="active"><i class="bi bi-box-arrow-in-right"></i> Sign In</a></li>
            <li><a href="register.html"><i class="bi bi-person-plus"></i> Register</a></li>
        </ul>
        <button class="btn-theme-toggle" style="background:var(--surface-inner);border:1px solid var(--border-subtle);color:var(--text-secondary);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;" title="Toggle Dark/Light Mode">
            <i class="bi bi-sun-fill"></i>
        </button>
    </header>

    <!-- Main Auth Card Container -->
    <main class="auth-container">
        <div class="auth-ambient-orb"></div>

        <div class="loginn">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your private reflections</p>

            <form id="loginForm">
                <div class="form-field-group">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <i class="bi bi-person field-icon"></i>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="form-field-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="bi bi-shield-lock field-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="btn-toggle-pwd" title="Show or hide password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit-auth">
                    Sign In <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div id="message">
                <h4>Don't have an account?</h4>
                <h4><a href="register.html">Create one here</a></h4>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        &copy; 2026 <strong>My Journal</strong>. Your thoughts, completely safe and private.
    </footer>

</body>
</html>
